play:grid;grid-template-columns:1.4fr .8fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{border:1px solid #dfe3eb;border-radius:9px;padding:11px 12px;outline:none;background:white}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3459e618}.field textarea{min-height:105px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}.offer{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}.offerhead{display:flex;justify-content:space-between;gap:12px}.offerprice{font-size:21px;font-weight:850}.stars{color:#d69a24}.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:17px;flex-wrap:wrap}.tabs button{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:700}.tabs button.active{background:var(--blue2);color:var(--blue);border-radius:8px}.notice{padding:12px 14px;background:#f4f6ff;border-radius:10px;color:#44578f;font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171a22;color:white;padding:12px 18px;border-radius:10px;z-index:20;box-shadow:var(--shadow)}.modalback{position:fixed;inset:0;background:#10152288;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:17px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead button{border:0;background:none;font-size:22px}.hidden{display:none!important}.pagehead{margin:8px 0 25px}.pagehead h1{font-size:32px;letter-spacing:-1px;margin:0}.pagehead p{color:var(--muted);margin:6px 0}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.metric{background:#f8f9fc;padding:17px;border-radius:12px}.metric strong{font-size:25px;display:block}.metric span{font-size:12px;color:var(--muted)}.profilehead{display:flex;gap:16px;align-items:center}.profilehead .avatar{width:58px;height:58px;font-size:20px}.footer{border-top:1px solid var(--line);padding:25px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.nav{gap:12px}.two{grid-template-columns:1fr}}@media(max-width:620px){.top{height:auto;min-height:64px;padding:12px 16px;flex-wrap:wrap;gap:10px}.nav{order:3;width:100%;overflow:auto;gap:18px;padding:8px 0 2px}.nav button{white-space:nowrap}.actions .btn:not(.primary){display:none}.wrap{padding:18px 15px 50px}.hero{padding:32px 22px}.hero h1{font-size:37px}.search{flex-wrap:wrap}.search input{flex-basis:100%}.search button{width:100%}.stats{gap:17px}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.metricgrid{grid-template-columns:1fr 1fr}.sectionhead{align-items:start;gap:12px;flex-direction:column}}
:root{color-scheme:dark;--ink:#eef2ff;--muted:#a0abc2;--line:#29344d;--paper:#151e32;--bg:#0b1020;--blue:#7892ff;--blue2:#202d50;--green:#43c995;--shadow:0 12px 36px #0005}body{background:var(--bg);color:var(--ink)}.top,.card,.panel,.modal,.offer,.metric{background:#151e32;color:var(--ink);border-color:var(--line)}.top{background:#10182a}.nav button,.textbtn{color:#c1cbe0}.btn,.chip{background:#1b2740;color:var(--ink);border-color:#34415d}.btn.primary{background:#526fe8;border-color:#526fe8;color:white}.hero{background:#17264a}.search{background:#1b2740}.search input{background:transparent;color:var(--ink)}.field input,.field textarea,.field select{background:#10182a;color:var(--ink);border-color:#34415d}.tag{background:#26324a;color:#d4ddf2}.tag.green{background:#123c35;color:#70e0b4}.notice{background:#202d50;color:#dce5ff}.metric{background:#1b2740}.tabs button{color:#aab6ce}.tabs button.active{background:#26375f;color:#aebfff}.empty b{color:var(--ink)}.modalback{background:#020617cc}.toast{background:#e8edff;color:#111827}.footer{border-color:var(--line)}</style></head><body>
<header class="top"><div class="brand"><span class="mark">R</span> reverse<span style="color:#3459e6">.</span></div><nav class="nav" id="nav"><button data-page="home" class="active">Home</button><button data-page="browse">Browse requests</button><button data-page="create">Post a request</button><button data-page="how">How it works</button></nav><div class="actions" id="authActions"><button class="btn" onclick="openAuth('login')">Log in</button><button class="btn primary" onclick="openAuth('register')">Get started</button></div></header>

<script>
const seedRequests=[
{id:1,title:"Brand identity for a new coffee shop",category:"Design & Creative",description:"Need a complete visual identity: logo, colour palette, typography and a few social templates. Looking for a clean, modern direction.",budget:650,deadline:"2026-12-18",buyer:"Maya Chen",offers:3,created:"2 hours ago",status:"open",image:"",owner:"buyer1"},
{id:2,title:"Build a Shopify store for skincare brand",category:"Web Development",description:"A polished Shopify storefront with around 20 products, subscriptions and email capture. Existing brand assets are ready.",budget:1800,deadline:"2026-12-30",buyer:"Oliver Grant",offers:5,created:"5 hours ago",status:"open",image:"",owner:"buyer2"},
{id:3,title:"Wedding photographer — full day",category:"Photography",description:"Looking for natural, documentary-style coverage for a summer wedding. Please include portfolio and package details.",budget:1200,deadline:"2027-01-15",buyer:"Sophie Williams",offers:2,created:"Yesterday",status:"open",image:"",owner:"buyer3"},
{id:4,title:"Short-form video editing for fitness creator",category:"Video & Animation",description:"12 vertical videos per month, captions, hooks and clean transitions. Ongoing monthly work for the right editor.",budget:450,deadline:"2026-12-05",buyer:"Noah Patel",offers:7,created:"Yesterday",status:"open",image:"",owner:"buyer4"},
{id:5,title:"Repair and restore a vintage oak dining table",category:"Home & Local",description:"Sand back, repair a loose joint and refinish a six-seater oak table. Collection from Bristol preferred.",budget:300,deadline:"2026-12-12",buyer:"Amelia Reed",offers:1,created:"2 days ago",status:"open",image:"",owner:"buyer5"},
{id:6,title:"SEO audit and 90-day growth plan",category:"Marketing",description:"Technical and content audit for a small SaaS website. Need prioritised fixes, keyword gaps and a practical plan.",budget:800,deadline:"2026-12-22",buyer:"Ethan Brooks",offers:4,created:"2 days ago",status:"open",image:"",owner:"buyer6"}];
const seedOffers=[{id:11,requestId:1,seller:"Studio North",price:540,days:10,message:"I can deliver a complete identity system with three initial concepts and two revision rounds.",rating:4.9,status:"pending"},{id:12,requestId:1,seller:"Pixel & Form",price:610,days:8,message:"Specialist hospitality branding. Includes logo suite, brand guide and social templates.",rating:4.8,status:"pending"},{id:13,requestId:1,seller:"Alex Morgan",price:475,days:14,message:"Independent designer with a focus on minimal brand systems.",rating:4.7,status:"pending"}];
let state=JSON.parse(localStorage.getItem("reverse_state")||"null")||{requests:seedRequests,offers:seedOffers,messages:[],reviews:[],user:null,transactions:[]};let page="home",category="All",searchTerm="",selected=null,dashTab="requests";
function save(){localStorage.setItem("reverse_state",JSON.stringify(state))}
function money(n){return "£"+Number(n).toLocaleString("en-GB")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let el=document.createElement("div");el.className="toast";el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function initials(s){return (s||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function go(p){page=p;selected=null;render();document.getElementById("nav").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.page===p))}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
function authUI(){let a=document.getElementById("authActions");a.innerHTML=state.user?'<button class="btn" onclick="go(\'dashboard\')">Dashboard</button><button class="btn primary" onclick="logout()">Log out</button>':'<button class="btn" onclick="openAuth(\'login\')">Log in</button><button class="btn primary" onclick="openAuth(\'register\')">Get started</button>'}
function requestCard(r){return '<article class="card"><div class="cardtop"><span class="tag">'+esc(r.category)+'</span><span class="muted" style="font-size:11px">'+esc(r.created)+'</span></div><h3>'+esc(r.title)+'</h3><div class="desc">'+esc(r.description.slice(0,105))+(r.description.length>105?'…':'')+'</div><div class="meta"><span>◷ '+esc(r.deadline)+'</span><span>♧ '+(r.offers||0)+' offers</span></div><div class="cardfoot"><div><div class="muted" style="font-size:11px">Budget up to</div><div class="price">'+money(r.budget)+'</div></div><button class="btn small" onclick="openRequest(\'\'+r.id+'\')">View request →</button></div></article>'}
function home(){let list=state.requests.filter(r=>r.status==="open").slice(0,3);return '<section class="hero"><div class="eyebrow">A smarter way to get things done</div><h1>Tell us what you need.<br>Let offers come to you.</h1><p>Post your request once. Get competitive offers from people who want your business.</p><div class="search"><input id="heroSearch" placeholder="What are you looking for? e.g. logo design, garden work" value="'+esc(searchTerm)+'" onkeydown="if(event.key===\'Enter\')doSearch()"><button class="btn primary" onclick="doSearch()">Find offers</button></div><div class="stats"><div><b>1,200+</b>active sellers</div><div><b>£2.4m</b>buyer budgets posted</div><div><b>7%</b>simple platform fee</div></div></section><div class="sectionhead"><div><h2>Recently posted requests</h2><p>See what buyers need right now.</p></div><button class="btn" onclick="go(\'browse\')">Browse all requests →</button></div><div class="grid">'+list.map(requestCard).join("")+'</div><div class="panel" style="margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap"><div><h2 style="margin:0 0 5px">Get the right work, at the right price.</h2><div class="muted">Sellers: browse live briefs and pitch for work.</div></div><button class="btn primary" onclick="requireAuth(()=>go(\'browse\'))">Explore opportunities</button></div>'}
function doSearch(){searchTerm=document.getElementById("heroSearch")?.value||"";go("browse")}
function browse(){let cats=["All","Design & Creative","Web Development","Photography","Video & Animation","Marketing","Home & Local","Other"];let list=state.requests.filter(r=>r.status==="open"&&(category==="All"||r.category===category)&&(!searchTerm||(r.title+" "+r.description+" "+r.category).toLowerCase().includes(searchTerm.toLowerCase())));return '<div class="pagehead"><h1>Browse buyer requests</h1><p>Find a brief that matches your skills and send an offer.</p></div><div class="search" style="border:1px solid var(--line);box-shadow:var(--shadow);margin:0 0 18px"><input id="browseSearch" placeholder="Search requests…" value="'+esc(searchTerm)+'" onkeydown="if(event.key===\'Enter\')applyBrowseSearch()"><button class="btn primary" onclick="applyBrowseSearch()">Search</button></div><div class="filters">'+cats.map(c=>'<button class="chip '+(category===c?'selected':'')+'" onclick="category='+JSON.stringify(c)+';render()">'+c+'</button>').join("")+'</div><div class="sectionhead" style="margin-top:12px"><div><b>'+list.length+' requests</b><span class="muted"> matching your search</span></div><span class="muted" style="font-size:12px">Sorted by newest</span></div><div class="grid">'+(list.length?list.map(requestCard).join(""):'<div class="panel empty" style="grid-column:1/-1"><b>No matching requests</b>Try another search or category.</div>')+'</div>'}
function applyBrowseSearch(){searchTerm=document.getElementById("browseSearch").value;render()}
function createPage(){return '<div class="pagehead"><h1>Post a request</h1><p>Describe what you need. Sellers will compete to win your business.</p></div><div class="two"><section class="panel"><form onsubmit="createRequest(event)"><div class="formgrid"><div class="field full"><label>What do you need?</label><input name="title" required minlength="5" maxlength="120" placeholder="e.g. Design a logo for my new business"><small class="muted">Rule: 5–120 characters. Be specific and truthful.</small></div><div class="field"><label>Category</label><select name="category"><option>Design & Creative</option><option>Web Development</option><option>Photography</option><option>Video & Animation</option><option>Marketing</option><option>Home & Local</option><option>Other</option></select></div><div class="field"><label>Maximum budget (£)</label><input name="budget" type="number" min="1" step="0.01" required placeholder="500"><small class="muted">Rule: enter a positive amount in GBP.</small></div><div class="field"><label>Deadline</label><input name="deadline" type="date" required min="2026-11-23"><small class="muted">Rule: choose today or a future date.</small></div><div class="field"><label>Reference image (optional)</label><input name="image" type="file" accept="image/*"></div><div class="field full"><label>Describe the job</label><textarea name="description" required minlength="20" placeholder="Include requirements, deliverables, preferences and anything sellers should know…"></textarea><small class="muted">Rule: at least 20 characters. Include scope and deliverables. No illegal, deceptive or prohibited requests.</small></div><div class="field full"><label>Anything else? (optional)</label><input name="notes" placeholder="Location, preferred experience, links…"></div><div class="field full"><button class="btn primary" type="submit">Publish request →</button></div></div></form></section><aside class="panel"><h3>How it works</h3><p class="muted">1. Publish your brief for free.</p><p class="muted">2. Sellers submit their price, timeline and approach.</p><p class="muted">3. Compare offers, ratings and messages.</p><p class="muted">4. Accept the best offer and confirm completion.</p><div class="notice"><b>Request rules</b><br>• Title: 5–120 characters.<br>• Description: at least 20 characters.<br>• Budget: positive GBP amount.<br>• Deadline: today or later.<br>• Be clear, lawful and honest. Do not post personal data, scams or prohibited goods/services.<br><br>No upfront listing fee. A 7% platform commission is recorded when a transaction is marked complete.</div></aside></div>'}
function createRequest(e){e.preventDefault();requireAuth(()=>{let f=e.target,r={id:Date.now(),title:f.title.value.trim(),category:f.category.value,budget:Number(f.budget.value),deadline:f.deadline.value,description:f.description.value.trim()+(f.notes.value?" "+f.notes.value:""),buyer:state.user.name,offers:0,created:"Just now",status:"open",owner:state.user.id,image:""};let file=f.image.files[0];if(file){let reader=new FileReader();reader.onload=()=>{r.image=reader.result;state.requests.unshift(r);save();toast("Your request is live");go("dashboard")};reader.readAsDataURL(file)}else{state.requests.unshift(r);save();toast("Your request is live");go("dashboard")}})}
function openRequest(id){selected=id;page="detail";render()}
function detail(){let r=state.requests.find(x=>x.id===selected);if(!r)return browse();let offers=state.offers.filter(o=>o.requestId===r.id);let mine=state.user&&r.owner===state.user.id;return '<button class="textbtn" onclick="go(\'browse\')">← Back to requests</button><div class="two" style="margin-top:16px"><section><div class="panel"><div class="cardtop"><span class="tag">'+esc(r.category)+'</span><span class="tag green">'+esc(r.status)+'</span></div><h1 style="font-size:29px;letter-spacing:-1px;line-height:1.15">'+esc(r.title)+'</h1><p class="muted">'+esc(r.description)+'</p>'+(mine&&r.status==="open"?'<div class="row" style="margin:14px 0"><button class="btn small" onclick="editRequest(\''+r.id+'\')">Edit request</button><button class="btn small" style="border-color:#b94b5b;color:#ff9aaa" onclick="deleteRequest(\''+r.id+'\')">Delete request</button></div>':'')+(r.image?'<img src="'+r.image+'" style="max-width:100%;max-height:280px;border-radius:12px;margin:10px 0">':'')+'<div class="meta"><span>Deadline: '+esc(r.deadline)+'</span><span>Posted '+esc(r.created)+'</span><span>By '+esc(r.buyer)+'</span></div><div class="cardfoot"><div><span class="muted">Budget up to</span><div class="price">'+money(r.budget)+'</div></div><span class="muted">'+offers.length+' offers received</span></div></div><div class="panel"><h2>Offers <span class="muted" style="font-size:14px">('+offers.length+')</span></h2>'+(offers.length?offers.map(o=>'<div class="offer"><div class="offerhead"><div><b>'+esc(o.seller)+'</b> <span class="stars">★ '+o.rating+'</span><div class="muted" style="font-size:12px">Delivery in '+o.days+' days</div></div><div class="offerprice">'+money(o.price)+'</div></div><p class="muted">'+esc(o.message)+'</p><div class="row">'+(mine&&o.status==="pending"?'<button class="btn primary small" onclick="acceptOffer(\'\'+o.id+'\')">Accept offer</button>':'')+'<button class="btn small" onclick="messageSeller(\'\'+o.id+'\')">Message seller</button>'+(o.status!=="pending"?'<span class="tag green">'+esc(o.status)+'</span>':'')+'</div></div>').join(""):'<div class="empty">No offers yet. Sellers can submit an offer from this page.</div>')+'</div></section><aside><div class="panel"><h3>Interested in this request?</h3>'+(state.user&&state.user.role==="seller"&&r.owner!==state.user.id?'<form onsubmit="submitOffer(event,\'\'+r.id+'\')"><div class="formgrid"><div class="field full"><label>Your price (£)</label><input name="price" type="number" min="1" max="'+r.budget+'" required placeholder="450"></div><div class="field full"><label>Delivery time (days)</label><input name="days" type="number" min="1" required placeholder="7"></div><div class="field full"><label>Your proposal</label><textarea name="message" required minlength="15" placeholder="Explain why you are right for this job…"></textarea></div><div class="field full"><button class="btn primary" type="submit">Send offer</button></div></div></form>':!state.user?'<button class="btn primary" onclick="openAuth(\'register\')">Join to make an offer</button>':state.user.role==="buyer"&&!mine?'<p class="muted">Switch to a seller account to submit an offer.</p>': '<p class="muted">This is your request. Compare incoming offers below.</p>')+'</div><div class="panel"><h3>Buyer</h3><div class="profilehead"><div class="avatar">'+initials(r.buyer)+'</div><div><b>'+esc(r.buyer)+'</b><div class="muted" style="font-size:12px">Member since 2026</div></div></div></div></aside></div>'}
function submitOffer(e,id){e.preventDefault();requireAuth(()=>{let f=e.target,r=state.requests.find(x=>x.id===id);if(state.user.role!=="seller")return toast("Seller account required");if(Number(f.price.value)>r.budget)return toast("Offer must be within the buyer's budget");state.offers.push({id:Date.now(),requestId:id,seller:state.user.name,price:Number(f.price.value),days:Number(f.days.value),message:f.message.value,rating:5,status:"pending"});r.offers=(r.offers||0)+1;save();toast("Offer sent");render()})}

async function ensureProfile(user){
 const {data:existing,error:readErr}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();if(readErr)throw readErr;if(existing)return existing;

 const {data,error}=await sb.from("profiles").upsert(profile).select().single();if(error)throw error;return data;

 const {data:{session}}=await sb.auth.getSession();state={requests:[],offers:[],messages:[],reviews:[],user:null,transactions:[]};
 if(session){const p=await ensureProfile(session.user);state.user={id:session.user.id,name:p.full_name,email:session.user.email,role:p.role};}
 const {data:rq,error:re}=await sb.from("requests").select("*,profiles!requests_buyer_id_fkey(full_name)").order("created_at",{ascending:false});if(re)throw re;
 state.requests=(rq||[]).map(r=>({id:r.id,title:r.title,category:r.category,description:r.description,budget:Number(r.budget),deadline:r.deadline||"",buyer:r.profiles?.full_name||"Buyer",offers:0,created:new Date(r.created_at).toLocaleDateString(),status:r.status==="in_progress"?"in progress":r.status,owner:r.buyer_id,image:(r.image_urls||[])[0]||""}));
 if(state.user){

  state.offers=(of||[]).map(o=>({id:o.id,requestId:o.request_id,seller:o.profiles?.full_name||"Seller",sellerId:o.seller_id,price:Number(o.price),days:o.delivery_days,message:o.message,rating:5,status:o.status==="rejected"?"not selected":o.status}));
  const {data:ms,error:me}=await sb.from("messages").select("*").order("created_at",{ascending:false});if(me)throw me;
  state.messages=(ms||[]).map(m=>({id:m.id,requestId:m.request_id,from:m.sender_id,to:m.recipient_id,fromId:m.sender_id,toId:m.recipient_id,text:m.body,at:new Date(m.created_at).toLocaleString()}));
  const {data:tx,error:te}=await sb.from("transactions").select("*").order("created_at",{ascending:false});if(te)throw te;
  state.transactions=(tx||[]).map(t=>({id:t.id,requestId:t.request_id,offerId:t.offer_id,buyerId:t.buyer_id,sellerId:t.seller_id,amount:Number(t.amount),commission:Number(t.commission_amount),status:t.status==="pending"?"in progress":t.status}));
 }
 state.requests.forEach(r=>r.offers=state.offers.filter(o=>o.requestId===r.id).length);dbReady=true;
}

 const {error}=await sb.from("offers").insert({request_id:id,seller_id:state.user.id,price:Number(f.price.value),delivery_days:Number(f.days.value),message:f.message.value.trim()});if(error)throw error;await loadDbState();render();toast("Offer sent");
